name: streak_mobile
description: "STREAK - Quinielas de fútbol donde lo que cuenta es no fallar nunca."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Arquitectura & Estado
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & Almacenamiento
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # UI, Fechas & Utilidades
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

  # Pasarela de Pagos (Sandbox Stripe)
  flutter_stripe: 14.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# Ícono de la app (assets/icons/icon.png se genera con tools/generar_icono.py).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#124E73"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
